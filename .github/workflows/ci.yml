name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Format
        if: runner.os == 'Linux' # formatting is platform-independent
        run: cargo fmt --all --check

      - name: Clippy (all features, warnings denied)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (all features)
        run: cargo test --all-features

  features:
    name: Feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: features

      # The sans-I/O core must build with no runtime / TLS / protocol features.
      - name: Core only (no default features)
        run: cargo build --no-default-features

      - name: TLS + HTTP/1.1 only
        run: cargo build --no-default-features --features rt-threadpool,tls

      - name: HTTP/2 (no HTTP/3)
        run: cargo build --no-default-features --features rt-threadpool,tls,h2

      - name: Router (no TLS, dependency-free)
        run: cargo build --no-default-features --features rt-threadpool,router

      - name: http-crate interop (with router)
        run: cargo build --no-default-features --features rt-threadpool,http,router

      - name: ACME without HTTP/3
        run: cargo build --no-default-features --features cli,tls,acme

      - name: tokio runtime
        run: cargo build --no-default-features --features rt-tokio,tls,h2

      - name: mio runtime
        run: cargo build --no-default-features --features rt-mio,tls

      - name: Everything
        run: cargo build --all-features

  # The release binaries are built with fullrust (libc-free, fully static:
  # https://github.com/KarpelesLab/fullrust), so the default feature set must
  # keep building and passing its tests on `x86_64-unknown-linux-fullrust`.
  # That target is not in the `unix` family and has no libc: unix-only code has
  # to name `target_os = "fullrust"` too. Keep the image in step with
  # release-binaries.yml.
  fullrust:
    name: fullrust (libc-free static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Test (default features)
        uses: KarpelesLab/fullrust@master
        with:
          image: ghcr.io/karpeleslab/fullrust:1.100
          command: test
          args: --release --lib --bins --tests

      - name: Build the binary
        uses: KarpelesLab/fullrust@master
        with:
          image: ghcr.io/karpeleslab/fullrust:1.100
          args: --release --bin httpsd

      - name: The binary is static and runs
        run: |
          bin=target/x86_64-unknown-linux-fullrust/release/httpsd
          file "$bin"
          if readelf -lW "$bin" | grep -Eq 'INTERP|DYNAMIC'; then
            echo "::error::$bin is not a static binary"; exit 1
          fi
          "$bin" --help >/dev/null

  msrv:
    name: MSRV (Rust 1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Keep this pin in sync with `rust-version` in Cargo.toml. The default
      # feature set (no tokio/mio/rsurl) is the surface we promise to build on
      # the declared minimum; compile-only (behavior is covered by `test`).
      - name: Install Rust 1.95 (declared MSRV)
        uses: dtolnay/rust-toolchain@1.95

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: cargo check (default features)
        run: cargo check --all-targets

  docs:
    name: Docs build (warnings denied)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings -D rustdoc::broken-intra-doc-links
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo doc --no-deps --all-features
        run: cargo doc --no-deps --all-features
